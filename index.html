    <script>
      // Ensure window.fetch is writable and has a setter to prevent "Cannot set property fetch of #<Window> which has only a getter"
      (function() {
        try {
          var originalFetch = window.fetch ? window.fetch.bind(window) : undefined;
          var currentFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return currentFetch;
            },
            set: function(fn) {
              currentFetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // Ignore
        }
      })();
    </script>
